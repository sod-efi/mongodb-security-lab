<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Security — Dashboard</title>
<style>
  :root{--bg:#0b1020;--panel:#131a30;--panel2:#0f1528;--line:#263157;--txt:#e8ecf8;--dim:#93a0c2;--red:#ff5a5a;--green:#3ddc97;--amber:#ffb454}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1b2650 0%,var(--bg) 55%);color:var(--txt);font-family:ui-sans-system,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
  h1{font-size:27px;margin:0 0 6px} .sub{color:var(--dim);margin:0 0 22px;font-size:14.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:#3a4a7d}
  .card h2{margin:0 0 4px;font-size:18px}
  .meta{color:var(--dim);font-size:12.5px;margin-bottom:10px}
  .nums{display:flex;gap:16px;font-size:13.5px;color:var(--dim)}
  .nums b{display:block;font-size:23px;color:var(--txt)}
  .nums .crit b{color:var(--red)} .nums .ok b{color:var(--green)}
  .empty{border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--dim)}
  #detail{margin-top:16px;display:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 6px;margin-right:6px}
  .CRITICAL{background:#3a1622;color:var(--red)} .HIGH{background:#3a2a12;color:var(--amber)} .MEDIUM{background:#37310f;color:#ffd166} .LOW{background:#17303f;color:#8ecae6} .INFO{background:#123324;color:var(--green)}
  .good{color:var(--green)} .bad{color:var(--red)}
  button.back{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:13.5px;margin-bottom:12px}
  code{background:#0a0f22;padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fleet dashboard</h1>
  <p class="sub">Every estate your local scanners report to. Results only — passwords are stripped by the sender <i>and</i> again on arrival.</p>
  <div id="fleet" class="grid"></div>
  <div id="none" class="empty" style="display:none">No estates yet. Run the app (<code>npm run app</code>), do a scan, and press <b>Send this result to my dashboard</b>.</div>
  <div id="detail"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function spark(values, color) {
  if (values.length < 2) return '<span style="color:var(--dim);font-size:12px">first scan — trend starts with the next one</span>';
  const w = 120, h = 30, max = Math.max(...values, 1);
  const pts = values.map((v, i) => (i / (values.length - 1)) * (w - 6) + 3 + ',' + (h - 3 - (v / max) * (h - 8))).join(' ');
  return '<svg width="' + w + '" height="' + h + '"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
}
async function loadFleet() {
  const d = await (await fetch('/api/estates')).json();
  const f = $('fleet'); f.innerHTML = '';
  $('none').style.display = d.estates.length ? 'none' : 'block';
  for (const e of d.estates) {
    const s = e.latest.summary;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h2>' + esc(e.estate) + '</h2><div class="meta">last scan ' + new Date(e.latest.receivedAt).toLocaleString() + ' · ' + e.runs + ' run(s) · phase: ' + esc(e.latest.phase) + '</div>' +
      '<div class="nums"><span><b>' + s.nodesDiscovered + '</b>nodes</span><span><b>' + s.credentialsHarvested + '</b>creds</span><span><b>' + s.findings + '</b>findings</span><span class="' + (s.critical ? 'crit' : 'ok') + '"><b>' + s.critical + '</b>critical</span></div>';
    card.addEventListener('click', () => openEstate(e.estate));
    f.appendChild(card);
  }
}
async function openEstate(name) {
  const d = await (await fetch('/api/estate?name=' + encodeURIComponent(name))).json();
  const el = $('detail'); el.style.display = 'block';
  const critTrend = d.trend.map((t) => t.summary.critical);
  let h = '<button class="back" onclick="document.getElementById(\'detail\').style.display=\'none\'">← all estates</button>';
  h += '<div class="panel"><h2>' + esc(d.estate) + ' — critical findings over time</h2>' + spark(critTrend, '#ff5a5a') +
    '<div style="font-size:14px;margin-top:6px">' + critTrend.join(' → ') + '</div>' +
    '<table style="margin-top:10px"><tr><th>when</th><th>phase</th><th>nodes</th><th>creds</th><th>findings</th><th>critical</th></tr>' +
    d.trend.map((t) => '<tr><td>' + new Date(t.receivedAt).toLocaleString() + '</td><td>' + esc(t.phase) + '</td><td>' + t.summary.nodesDiscovered + '</td><td>' + t.summary.credentialsHarvested + '</td><td>' + t.summary.findings + '</td><td class="' + (t.summary.critical ? 'bad' : 'good') + '"><b>' + t.summary.critical + '</b></td></tr>').join('') + '</table></div>';
  if (d.diff) {
    const df = d.diff;
    h += '<div class="panel"><h2>What changed since the previous scan</h2>';
    h += '<p style="font-size:14.5px">Critical: <b class="' + (df.criticalAfter < df.criticalBefore ? 'good' : df.criticalAfter > df.criticalBefore ? 'bad' : '') + '">' + df.criticalBefore + ' → ' + df.criticalAfter + '</b></p>';
    if (df.nodesAdded.length) h += '<p class="bad">New nodes: ' + df.nodesAdded.map((n) => '<code>' + esc(n) + '</code>').join(' ') + '</p>';
    if (df.nodesRemoved.length) h += '<p>Nodes gone: ' + df.nodesRemoved.map((n) => '<code>' + esc(n) + '</code>').join(' ') + '</p>';
    if (df.findingsResolved.length) h += '<p class="good">✓ Resolved (' + df.findingsResolved.length + '):</p><ul>' + df.findingsResolved.map((f) => '<li><span class="chip ' + f.severity + '">' + f.severity + '</span>' + esc(f.title) + ' — <code>' + esc(f.nodeId) + '</code></li>').join('') + '</ul>';
    if (df.findingsNew.length) h += '<p class="bad">New findings (' + df.findingsNew.length + '):</p><ul>' + df.findingsNew.map((f) => '<li><span class="chip ' + f.severity + '">' + f.severity + '</span>' + esc(f.title) + ' — <code>' + esc(f.nodeId) + '</code></li>').join('') + '</ul>';
    if (!df.nodesAdded.length && !df.nodesRemoved.length && !df.findingsNew.length && !df.findingsResolved.length) h += '<p style="color:var(--dim)">No changes — identical picture.</p>';
    h += '</div>';
  }
  const lf = [...d.latest.run.findings].sort((a, b) => a.severity.localeCompare(b.severity));
  h += '<div class="panel"><h2>Latest findings — ' + esc(d.estate) + '</h2><table><tr><th>severity</th><th>finding</th><th>node</th></tr>' +
    lf.map((f) => '<tr><td><span class="chip ' + f.severity + '">' + f.severity + '</span></td><td>' + esc(f.title) + '</td><td><code>' + esc(f.nodeId) + '</code></td></tr>').join('') + '</table></div>';
  el.innerHTML = h;
  el.scrollIntoView({ behavior: 'smooth' });
}
loadFleet();
</script>
</body>
</html>
